<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>art-hov beheer</title><link rel="stylesheet" href="/admin/styles.css"></head>
<body><main class="admin">
  <section id="login"><h1>Beheer</h1><p>Log in om de inhoud van art-hov.blog te beheren.</p><form id="login-form"><label>Wachtwoord <input type="password" name="password" required autocomplete="current-password"></label><button>Inloggen</button><p class="error" id="login-error"></p></form></section>
  <section id="app" hidden><header><h1>Beheer</h1><button id="logout" class="quiet">Uitloggen</button></header><div class="toolbar"><button id="new">Nieuwe pagina</button><button id="refresh" class="quiet">Vernieuwen</button></div><div class="layout"><aside><input id="filter" placeholder="Zoeken"><ul id="items"></ul></aside><section class="editor"><form id="editor"><label>Bestandspad <input id="path" required pattern="content/.+\.md" placeholder="content/snippets/nieuw-verhaal.md"></label><label>Front matter <small>YAML of TOML; onbekende velden blijven behouden.</small><textarea id="frontmatter" rows="12" spellcheck="false"></textarea></label><label>Markdown <textarea id="body" rows="20" spellcheck="true"></textarea></label><div class="actions"><button type="submit">Opslaan en publiceren</button><button type="button" id="delete" class="danger">Verwijderen</button></div><p id="message" role="status"></p></form></section></div></section>
</main><script type="module" src="/admin/app.js"></script></body></html>
